packages:
  - "packages/*"
  - "apps/*"

# Dependencies allowed to run install/build scripts (esbuild powers Vitest,
# sharp powers Next.js image optimization).
onlyBuiltDependencies:
  - esbuild
  - sharp
allowBuilds:
  esbuild: true
  sharp: true

# Nextra 4.6's docs theme strips `children` before validating its Layout props
# against a schema that still requires it; zod >= 4.4 rejects the missing key
# (older zod treated a missing `z.custom` key as present). Pin zod *only* under
# the Nextra subtree to 4.3.x so the docs site builds. packages/core + apps/api
# keep zod 4.4.x (what the Anthropic SDK is built against).
overrides:
  nextra>zod: "4.3.5"
  nextra-theme-docs>zod: "4.3.5"
  # Next.js 15 hard-pins postcss@8.4.31, which a security advisory flags
  # (latest advisory patched in >= 8.5.18). Force the patched postcss across the
  # tree; postcss 8.5.x is API-compatible with 8.4.x.
  postcss: "^8.5.18"
  # speech-rule-engine (via nextra's MathJax support) hard-pins
  # @xmldom/xmldom@0.9.10, which has several high-severity advisories
  # (patched in >= 0.9.12). Same-minor patch release, so API-compatible.
  "@xmldom/xmldom": "^0.9.12"
